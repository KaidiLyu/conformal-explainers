name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev,demo]'
      - run: ruff check src/conformal_explainers tests scripts app.py
      - run: pytest -q
      - run: conformal-cv smoke
      - run: conformal-cv report --results outputs/smoke

